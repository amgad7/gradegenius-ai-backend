name: gradegenius
description: "Essay Grader AI - The Lucid Scholar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Dependency Injection
  get_it: ^8.0.3

  # UI
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.5

  # Utilities
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.5.1
  file_selector: ^1.1.0

  # Document reading (PDF + DOCX)
  syncfusion_flutter_pdf: ^28.1.33
  docx_to_text: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - datasets/
    - shorebird.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "assets/images/icon.png"
  adaptive_icon_foreground: "assets/images/icon.png"
